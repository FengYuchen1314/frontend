name: Xboard CI

on:
  push:
    branches:
      - main
      - xboard-dev
  pull_request:
permissions:
  contents: read

concurrency:
  group: xboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build frontend
    if: github.repository == 'FengYuchen1314/frontend'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine change range
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Use the fork Backend contract
        shell: bash
        run: |
          git clone --depth 1 --branch xboard-dev \
            https://github.com/FengYuchen1314/backend.git \
            "$RUNNER_TEMP/xboard-backend"
          npm install \
            --prefix "$RUNNER_TEMP/xboard-backend/libs/contract" \
            --no-audit \
            --no-fund \
            --no-package-lock \
            --ignore-scripts
          npm run --prefix "$RUNNER_TEMP/xboard-backend/libs/contract" prepublish
          contract_tarball=$(npm pack \
            "$RUNNER_TEMP/xboard-backend/libs/contract" \
            --pack-destination "$RUNNER_TEMP" \
            --silent)
          npm install \
            --no-audit \
            --no-fund \
            --no-package-lock \
            --no-save \
            "$RUNNER_TEMP/$contract_tarball"

      - name: Check changed-file formatting
        shell: bash
        run: |
          mapfile -d '' -t changed_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ steps.changes.outputs.base }}" \
              "${{ steps.changes.outputs.head }}" -- \
              '*.css' '*.js' '*.json' '*.md' \
              '*.ts' '*.tsx' '*.yaml' '*.yml'
          )
          if ((${#changed_files[@]})); then
            npx oxfmt --check "${changed_files[@]}"
          fi

      - name: Lint changed source files
        shell: bash
        run: |
          mapfile -d '' -t source_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ steps.changes.outputs.base }}" \
              "${{ steps.changes.outputs.head }}" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx'
          )
          if ((${#source_files[@]})); then
            npx oxlint --format=stylish "${source_files[@]}"
          fi

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run start:build
